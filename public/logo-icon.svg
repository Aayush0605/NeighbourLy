  </defs>

  <!-- Squircle Container -->
  <rect width="128" height="128" rx="32" fill="url(#iconBg)" />
  <rect width="126" height="126" x="1" y="1" rx="31" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

  <!-- Logo Mark -->
  <g transform="translate(14, 14)">
    <circle cx="31" cy="22" r="8.5" fill="url(#iconHeadL)" />
    <circle cx="69" cy="19" r="9" fill="url(#iconHeadR)" />
    <path
      d="M 21 76 C 21 54, 23 43, 31 41 C 41 39, 51 55, 60 75 C 64 63, 68 49, 72 37"
      stroke="url(#iconRibbon)"
